<style>
:root{
  --ink:#0c0a09;--ink-soft:#44403c;--ink-mute:#78716c;
  --paper:#faf7f0;--paper-2:#f3ede0;--paper-3:#e8dfcb;--rule:#d6ceb8;
  --burgundy:#7c2d12;--burgundy-dark:#450a0a;--teal:#0f4c4c;
  --gold:#b08634;--gold-soft:#d4a84b;--gold-pale:#f4e4b8;
  --white:#fff;
  --serif:'Fraunces',Georgia,'Times New Roman',Times,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--gold)}
.bar{background:var(--ink);color:#cfc4ad;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.bar .brand{font-family:var(--serif);font-size:13px;color:var(--gold-soft);letter-spacing:.18em;font-weight:600;border:none}
.bar .links{display:flex;align-items:center;gap:18px}
.bar a{color:var(--gold-pale);font-size:12px;letter-spacing:.02em;font-weight:500;border:none}
.bar a:hover{color:var(--gold-soft)}
.bar .cart-link{position:relative;background:rgba(212,168,75,.14);padding:6px 14px;border-radius:2px;color:var(--gold-soft);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.cart-badge{background:var(--burgundy);color:#fdf6e3;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center;display:inline-block}
main{max-width:1080px;margin:0 auto;padding:48px 28px 80px;display:grid;grid-template-columns:1fr;gap:48px}
@media(min-width:860px){main{grid-template-columns:320px 1fr;gap:64px;padding:64px 28px 96px;align-items:start}}
.cover-wrap{position:sticky;top:60px}
.cover{width:100%;max-width:320px;aspect-ratio:2/3;border-radius:3px;box-shadow:10px 20px 50px -12px rgba(12,10,9,.45),0 6px 14px -4px rgba(12,10,9,.22);display:block;margin:0 auto}
.launch-ribbon{display:inline-block;background:var(--gold);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px;border-radius:2px;margin-bottom:16px;transform:rotate(-2deg);box-shadow:0 3px 8px rgba(176,134,52,.35)}
.crumb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-bottom:14px}
.crumb a{color:var(--gold);font-weight:600;border:none}
h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(34px,4.5vw,48px);line-height:1.06;letter-spacing:-.015em;margin-bottom:10px}
h1 em{font-style:normal;color:var(--burgundy);font-weight:600}
.sub{font-family:var(--serif);font-size:19px;line-height:1.5;font-style:italic;font-weight:300;color:var(--ink-soft);margin-bottom:10px}
.by{font-size:14px;color:var(--ink-mute);margin-bottom:24px}
.by strong{color:var(--ink);font-weight:600}
.blurb{font-family:var(--serif);font-size:18px;line-height:1.7;color:var(--ink-soft);margin-bottom:28px}
.blurb::first-letter{font-size:44px;float:left;line-height:.9;padding:4px 8px 0 0;color:var(--burgundy);font-weight:600;font-style:normal}
.price-box{background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--gold);padding:22px 24px;border-radius:3px;margin-bottom:20px}
.prices{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.price{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--burgundy)}
.price-was{font-family:var(--serif);font-size:18px;color:var(--ink-mute);text-decoration:line-through}
.price-note{font-size:13px;color:var(--ink-mute);font-style:italic}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 28px;border-radius:2px;font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;text-decoration:none;transition:background .15s}
.btn-primary{background:var(--burgundy);color:#fdf6e3;box-shadow:0 3px 0 var(--ink)}
.btn-primary:hover{background:#92400e}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn-outline:hover{border-color:var(--ink)}
.trust{font-size:13px;color:var(--ink-mute);margin-bottom:28px;line-height:1.8}
.trust span{margin:0 6px;color:var(--gold)}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding-top:20px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-soft)}
.meta-row .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:28px;overflow-x:auto}
.tab-btn{background:none;border:none;padding:14px 18px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab-btn.active{color:var(--burgundy);border-bottom-color:var(--burgundy)}
.tab-btn:hover{color:var(--ink)}
.tab-panels{}
.panel{display:none}
.panel.active{display:block}
.panel h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;margin:24px 0 10px;color:var(--ink)}
.panel p{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--ink-soft);margin-bottom:14px}
.panel ul{list-style:none;padding:0;margin:12px 0}
.panel li{padding:8px 0 8px 28px;position:relative;font-family:var(--serif);font-size:16px;color:var(--ink-soft);border-bottom:1px solid var(--rule)}
.panel li::before{content:"§";position:absolute;left:0;top:8px;color:var(--gold);font-weight:700}
.editions{margin-top:28px;padding-top:24px;border-top:1px solid var(--rule)}
.editions h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.ed-row{display:flex;gap:10px;flex-wrap:wrap}
.ed-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--rule);border-radius:2px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--white)}
.ed-pill:hover{border-color:var(--gold);color:var(--burgundy)}
.ed-pill .ed-cur{color:var(--gold);font-weight:700}
.ed-pill .ed-cur.coming{color:var(--ink-mute);font-style:italic;font-weight:400}
.also{margin-top:48px;padding-top:32px;border-top:1px solid var(--rule)}
.also h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:16px}
.also-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:600px){.also-grid{grid-template-columns:repeat(2,1fr)}}
.also-book{text-decoration:none;color:var(--ink);border:none;display:block}
.also-book:hover .al-cover{transform:translateY(-3px)}
.al-cover{width:100%;aspect-ratio:2/3;border-radius:2px;box-shadow:4px 8px 16px -6px rgba(12,10,9,.25);margin-bottom:8px;transition:transform .2s}
.al-t{font-family:var(--serif);font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al-p{font-family:var(--serif);font-size:12px;color:var(--burgundy);font-weight:700;margin-top:2px}
.ornament{text-align:center;margin:32px 0;color:var(--gold);opacity:.6}
footer{background:var(--ink);color:#a89f8f;padding:40px 28px;text-align:center;font-size:13px}
footer a{color:var(--gold-soft)}
/* Cover generator (same system as library) */
.book-cover{background:linear-gradient(135deg,var(--c,#1c1917),#0a0605);color:#f5f0e6;display:flex;flex-direction:column;justify-content:space-between;padding:22px 16px;font-family:var(--serif);position:relative}
.book-cover .spine{position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.28);border-radius:2px 0 0 2px}
.book-cover .top{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;font-weight:600;font-family:var(--sans);z-index:1}
.book-cover .ttl{font-size:26px;font-weight:600;line-height:1.1;z-index:1;font-style:italic}
.book-cover .ttl small{display:block;font-size:13px;font-weight:400;font-style:italic;opacity:.85;margin-top:8px}
.book-cover .gold-rule{position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(212,168,75,.5)}
.book-cover .bot{margin-top:auto;z-index:1}
.book-cover .author{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;font-family:var(--sans);font-weight:700;margin-bottom:3px}
.book-cover .sku{font-size:8px;opacity:.5;font-family:var(--sans);letter-spacing:.1em}
/* cart toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fdf6e3;padding:14px 20px;border-radius:3px;font-family:var(--sans);font-size:14px;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);z-index:200;transform:translateY(120%);transition:transform .25s ease;display:flex;align-items:center;gap:14px}
.toast.show{transform:translateY(0)}
.toast a{color:var(--gold-soft);font-weight:700;border-bottom:1px solid var(--gold);margin-left:6px}
/* Cart drawer */
.drawer{position:fixed;inset:0;background:rgba(12,10,9,.5);z-index:150;display:none}
.drawer.open{display:block}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.drawer.open .drawer-panel{transform:translateX(0)}
.drawer-h{padding:20px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.drawer-h h3{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:500}
.drawer-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-mute);width:36px;height:36px;border-radius:50%}
.drawer-close:hover{background:var(--paper-2);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px}
.drawer-foot{padding:20px 24px;border-top:1px solid var(--rule);background:var(--paper-2)}
.cart-item{display:grid;grid-template-columns:50px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:center}
.ci-mini{width:50px;aspect-ratio:2/3;border-radius:2px}
.ci-t{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.3}
.ci-p{font-size:12px;color:var(--ink-mute)}
.ci-x{background:none;border:none;color:var(--ink-mute);cursor:pointer;font-size:16px;padding:4px}
.ci-x:hover{color:var(--burgundy)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:14px;font-family:var(--serif);font-size:18px;font-weight:600}
.btn-block{width:100%;justify-content:center}
.cart-empty{text-align:center;padding:60px 20px;font-family:var(--serif);font-style:italic;color:var(--ink-mute)}
</style>

<script>
const BASE = '/VOIA-BOOKS/v2/';
const params = new URLSearchParams(location.search);
const sku = params.get('sku');
const b = BOOKS.find(x=>x.sku===sku);
if(!b){ document.getElementById('main').innerHTML='<div style="padding:60px 0;text-align:center"><p style="font-family:var(--serif);font-style:italic;color:var(--ink-mute);font-size:18px">We couldn\'t find that book.</p><p style="margin-top:16px"><a class="btn btn-outline" href="/VOIA-BOOKS/v2/library/">Back to the library</a></p></div>'; throw new Error('no such sku '+sku); }

// Meta + title
document.getElementById('page-title').textContent = b.title+' — Voice of I AM';
document.getElementById('page-desc').setAttribute('content', (b.blurb||'').substring(0,160));
fbq('track','ViewContent',{content_ids:[b.sku],content_name:b.title,value:b.priceNG,currency:'NGN'});

function darken(hex,amt){
  var c=hex.replace('#','');
  if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),bb=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.floor(r*(1-amt)));g=Math.max(0,Math.floor(g*(1-amt)));bb=Math.max(0,Math.floor(bb*(1-amt)));
  return '#'+[r,g,bb].map(function(n){var h=n.toString(16);return h.length<2?'0'+h:h}).join('');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return '₦'+Number(n).toLocaleString()}

// Cover
var coverStyle = 'background:linear-gradient(135deg,'+b.coverColor+','+darken(b.coverColor,.3)+')';
var pages = b.pages ? ('<div class="mi"><div class="k">Length</div><div>'+b.pages+' pages</div></div>') : '';
var author = b.author.replace('Munachimso E. Nwagbara','Munachimso Nwagbara');

// Pricing — show launch price if active
var now = Date.now();
var LAUNCH_END = new Date('2026-10-26T23:59:00+01:00').getTime();
var isLaunch = b.priceNGLaunch && now < LAUNCH_END && b.sku==='TRY-037';
var price = isLaunch ? b.priceNGLaunch : b.priceNG;
var wasPrice = isLaunch ? b.priceNG : null;

// Tabs content
var includes = b.save ? '<p><em>Bundle price saves you '+esc(b.save)+'.</em></p>' : '';
var whatYouGet = '<ul>'
  +'<li>Instant PDF download — readable on phone, tablet, e-reader, or laptop</li>'
  +'<li>EPUB version for Apple Books, Koboreader, and every reader app</li>'
  +'<li>Lifetime updates — every new edition, free, for life</li>'
  +(b.paperback?'<li>Paperback option available at checkout — shipped anywhere in Nigeria</li>':'')
  +'</ul>';

// Related books
var rel = BOOKS.filter(x=>x.sku!==b.sku && x.shelf===b.shelf).slice(0,3);
if(rel.length<3){ rel = rel.concat(BOOKS.filter(x=>x.sku!==b.sku && x.featured && rel.indexOf(x)<0)).slice(0,3); }

// Editions cross-link (Paycheck has global)
var editions = '';
if(b.sku==='TRY-037'){
  editions = '<div class="editions"><h3>Editions</h3><div class="ed-row">'
    +'<a class="ed-pill" href="'+BASE+'paycheck/"><span class="ed-cur">₦</span> Nigerian edition — Naira, Nigerian examples</a>'
    +'<span class="ed-pill" style="opacity:.65;cursor:default"><span class="ed-cur coming">$</span> Global edition — USD (coming soon)</span>'
    +'</div></div>';
}

var mainHTML =
  '<div class="cover-wrap">'
    +'<div class="book-cover cover" style="'+coverStyle+'">'
      +'<div class="spine"></div>'
      +'<div class="gold-rule"></div>'
      +'<div class="top">'+esc(b.sku)+' · Voice of I AM</div>'
      +'<div class="ttl">'+esc(b.title)+(b.subtitle?'<small>'+esc(b.subtitle)+'</small>':'')+'</div>'
      +'<div class="bot"><div class="author">'+esc(author)+'</div><div class="sku">'+esc(b.shelf)+'</div></div>'
    +'</div>'
  +'</div>'
  +'<div class="body">'
    +(isLaunch?'<div class="launch-ribbon">Launch price · ends soon</div>':'')
    +'<div class="crumb"><a href="/VOIA-BOOKS/v2/library/">Library</a> / '+esc(SHELVES.find(s=>s.id===b.shelf).label)+'</div>'
    +'<h1>'+esc(b.title)+'.</h1>'
    +'<div class="sub">'+esc(b.subtitle||'')+'</div>'
    +'<div class="by">By <strong>'+esc(author)+'</strong>'+(b.pages?' · '+b.pages+' pages':'')+'</div>'
    +'<p class="blurb">'+esc(b.blurb)+'</p>'

    +'<div class="price-box">'
      +'<div class="prices">'
        +'<span class="price">'+fmt(price)+'</span>'
        +(wasPrice?'<span class="price-was">'+fmt(wasPrice)+'</span>':'')
      +'</div>'
      +'<div class="price-note">Instant PDF + EPUB · Lifetime updates · 30-day refund'+(isLaunch?' · Launch price ends soon':'')+'</div>'
    +'</div>'
    +'<div class="ctas">'
      +(b.live
        ? '<button class="btn btn-primary" onclick="buyNow()">Buy now →</button>'
        : '<button class="btn btn-primary" style="opacity:.65;cursor:not-allowed" disabled>Coming soon</button>')
      +'<button class="btn btn-outline" onclick="VOIA.cart.add(\''+b.sku+'\',{title:\''+esc(b.title).replace(/'/g,"\\'")+'\',price:'+price+',edition:\'PDF\''+'});toastAdd();renderCart()">Add to bag</button>'
    +'</div>'
    +'<div class="trust">Secure Paystack checkout<span>·</span>Instant download after payment<span>·</span>30-day no-questions refund</div>'

    +'<div class="tabs">'
      +'<button class="tab-btn active" data-tab="what">What you get</button>'
      +'<button class="tab-btn" data-tab="about">About the book</button>'
      +(b.contains?'<button class="tab-btn" data-tab="contains">Inside this bundle</button>':'')
    +'</div>'
    +'<div class="tab-panels">'
      +'<div class="panel active" data-panel="what">'+whatYouGet+'</div>'
      +'<div class="panel" data-panel="about"><p>'+esc(b.blurb)+'</p><p style="color:var(--ink-mute);font-style:italic;margin-top:20px">Written by '+esc(author)+'. Published by Voice of I AM Publishing House, Lagos.</p></div>'
      +(b.contains?'<div class="panel" data-panel="contains"><p>This bundle contains:</p><ul>'+b.contains.map(sku=>{var rb=BOOKS.find(x=>x.sku===sku);return rb?'<li><strong>'+esc(rb.title)+'</strong> — '+esc(rb.subtitle||'')+'</li>':''}).join('')+'</ul></div>':'')
    +'</div>'

    +editions

    +(rel.length?'<div class="also"><h3>You might also like</h3><div class="also-grid">'+rel.map(r=>{
      var cs='background:linear-gradient(135deg,'+r.coverColor+','+darken(r.coverColor,.3)+')';
      return '<a class="also-book" href="?sku='+r.sku+'">'
        +'<div class="al-cover book-cover" style="'+cs+'"><div class="spine" style="background:rgba(0,0,0,.28);position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px"></div>'
          +'<div style="font-size:7px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-family:var(--sans);font-weight:700">'+esc(r.sku)+'</div>'
          +'<div style="font-family:var(--serif);font-weight:600;font-size:12px;line-height:1.15;margin-top:auto;padding-top:40px">'+esc(r.title.length>30?r.title.substring(0,28)+'…':r.title)+'</div>'
        +'</div>'
        +'<div class="al-t">'+esc(r.title)+'</div>'
        +'<div class="al-p">'+fmt(r.priceNG)+'</div>'
      +'</a>';
    }).join('')+'</div></div>':'')
  +'</div>';

document.getElementById('main').innerHTML = mainHTML;

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector('.panel[data-panel="'+btn.dataset.tab+'"]').classList.add('active');
  });
});

function buyNow(){
  // If live and has Paystack NG link, go direct (sales-page behavior); if inline is on, use inline.
  if(b.paystackNG){
    if(window.fbq) fbq('track','InitiateCheckout',{content_ids:[b.sku],content_name:b.title,value:price,currency:'NGN'});
    window.open('https://paystack.shop/pay/'+b.paystackNG,'_blank');
  } else {
    // Fallback — add to cart
    VOIA.cart.add(b.sku,{title:b.title,price:price,edition:'PDF'});
    openCart();
  }
}

// Cart drawer
function openCart(){ document.getElementById('drawer').classList.add('open'); renderCart(); }
function closeCart(){ document.getElementById('drawer').classList.remove('open'); }
function renderCart(){
  var items = VOIA.cart.items();
  var body = document.getElementById('cart-body');
  var foot = document.getElementById('cart-foot');
  if(items.length===0){
    body.innerHTML='<div class="cart-empty">Your bag is empty.<br>Browse the library to find something worth reading.</div>';
    foot.innerHTML='<a class="btn btn-outline btn-block" href="/VOIA-BOOKS/v2/library/" style="justify-content:center">Browse the library →</a>';
    return;
  }
  body.innerHTML = items.map(it=>{
    var rb = BOOKS.find(x=>x.sku===it.sku);
    var cs = rb ? 'background:linear-gradient(135deg,'+rb.coverColor+','+darken(rb.coverColor,.3)+')' : 'background:#1c1917';
    return '<div class="cart-item">'
      +'<div class="ci-mini book-cover" style="'+cs+';padding:8px 6px"><div style="font-size:6px;letter-spacing:.1em;opacity:.7;font-family:var(--sans);font-weight:700">'+esc(it.sku)+'</div><div style="font-family:var(--serif);font-weight:600;font-size:8px;line-height:1.1;margin-top:auto;padding-top:26px">'+esc(it.title.length>22?it.title.substring(0,20)+'…':it.title)+'</div></div>'
      +'<div><div class="ci-t">'+esc(it.title)+'</div><div class="ci-p">'+fmt(it.price)+' × '+it.qty+' · PDF</div></div>'
      +'<button class="ci-x" onclick="VOIA.cart.remove(\''+it.sku+'\');renderCart()" title="Remove">×</button>'
    +'</div>';
  }).join('');
  var tot = VOIA.cart.total();
  foot.innerHTML = '<div class="cart-total"><span>Total</span><span>'+fmt(tot)+'</span></div>'
    +'<button class="btn btn-primary btn-block" onclick="checkoutCart()">Checkout →</button>'
    +'<p style="font-size:12px;color:var(--ink-mute);text-align:center;margin-top:10px;font-style:italic">Secure Paystack · 30-day refund</p>';
}
function checkoutCart(){ VOIA.cart.checkout(); }

function toastAdd(){
  var t=document.getElementById('toast');
  t.innerHTML='Added to your bag. <a href="#" onclick="openCart();return false">View bag →</a>';
  t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(()=>t.classList.remove('show'),2800);
}

// Wire header cart
document.querySelectorAll('[data-cart-count]').forEach(el=>VOIA.cart.add||null);
// Initial render
renderCart();
</script>
</body>
</html>
